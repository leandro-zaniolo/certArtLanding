<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cer.Art | Links</title>
  <meta name="description" content="Links oficiais da Cer.Art: Shopee, WhatsApp e TikTok Shop." />
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-PSD81RS3QQ"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag("js", new Date());
    gtag("config", "G-PSD81RS3QQ");
  </script>
  <style>
    :root {
      --bg: #f4eee7;
      --card: #fbf8f3;
      --text: #4d3c2f;
      --muted: #7a6756;
      --brand: #b47a48;
      --brand-2: #c9976b;
      --border: #e4d7ca;
      --shadow: 0 12px 30px rgba(105, 79, 58, 0.14);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", Roboto, -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top right, #efe7de 5%, transparent 45%),
        radial-gradient(circle at bottom left, #f0e7db 2%, transparent 40%),
        var(--bg);
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 430px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 28px;
      box-shadow: var(--shadow);
      padding: 28px 22px 24px;
      text-align: center;
    }

    .logo-wrapper {
      width: 112px;
      height: 112px;
      border-radius: 999px;
      margin: 0 auto 14px;
      background: #fff;
      border: 2px solid #e5d6c6;
      overflow: hidden;
      display: grid;
      place-items: center;
    }

    .logo-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    h1 {
      margin: 6px 0 8px;
      font-size: 1.8rem;
      letter-spacing: 0.4px;
      color: var(--brand);
    }

    p {
      margin: 0 0 20px;
      color: var(--muted);
      font-size: 0.98rem;
      line-height: 1.45;
    }

    .links {
      display: grid;
      gap: 12px;
      margin-top: 8px;
    }

    .link-btn {
      text-decoration: none;
      color: #fff;
      font-weight: 600;
      padding: 14px 16px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--brand), var(--brand-2));
      border: 1px solid rgba(255, 255, 255, 0.25);
      transition: transform 0.18s ease, box-shadow 0.18s ease, filter 0.18s ease;
      box-shadow: 0 8px 16px rgba(148, 105, 67, 0.25);
    }

    .link-btn:hover,
    .link-btn:focus-visible {
      transform: translateY(-2px);
      filter: brightness(1.05);
      box-shadow: 0 11px 22px rgba(148, 105, 67, 0.3);
      outline: none;
    }

    footer {
      margin-top: 18px;
      font-size: 0.78rem;
      color: #9b8675;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo-wrapper">
      <img src="assets/logo-certart.png" alt="Logo Cer.Art" />
    </div>

    <h1>Cer.Art</h1>
    <p>Peças de cerâmica e artesanato feitas com muito carinho, trazendo a magia do universo infantil e o encanto dos bichinhos de pano. Escolha um canal abaixo para comprar ou falar com a gente.</p>

    <section class="links" aria-label="Links principais">
      <a class="link-btn" data-link-name="shopee" href="https://br.shp.ee/tzdwR5fn" target="_blank" rel="noopener noreferrer">Shopee</a>
      <a class="link-btn" data-link-name="whatsapp" href="https://wa.me/5511978533495" target="_blank" rel="noopener noreferrer">WhatsApp</a>
      <a class="link-btn" data-link-name="instagram" href="https://www.instagram.com/_cer.art?igsh=MTBpYmtrdGQwZmh3cw%3D%3D&utm_source=qr" target="_blank" rel="noopener noreferrer">Instagram</a>
    </section>

    <footer>cer.art</footer>
  </main>
  <script>
    document.querySelectorAll(".link-btn").forEach(function (link) {
      link.addEventListener("click", function () {
        if (typeof gtag !== "function") return;
        gtag("event", "link_click", {
          link_name: link.dataset.linkName || link.textContent.trim().toLowerCase(),
          link_url: link.href
        });
      });
    });
  </script>
</body>
</html>
