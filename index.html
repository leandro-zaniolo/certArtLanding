<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cer.Art | Links</title>
  <meta name="description" content="Links oficiais da Cer.Art: Shopee, WhatsApp e TikTok Shop." />
  <!-- Global Site Tag (gtag.js): substitua G-PSD81RS3QQ pelo seu Measurement ID (script externo + config abaixo). -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-PSD81RS3QQ"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag("js", new Date());
    gtag("config", "G-PSD81RS3QQ");
  </script>
  <style>
    :root {
      --bg: #f4eee7;
      --card: #fbf8f3;
      --text: #4d3c2f;
      --muted: #7a6756;
      --brand: #b47a48;
      --brand-2: #c9976b;
      --border: #e4d7ca;
      --shadow: 0 12px 30px rgba(105, 79, 58, 0.14);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", Roboto, -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top right, #efe7de 5%, transparent 45%),
        radial-gradient(circle at bottom left, #f0e7db 2%, transparent 40%),
        var(--bg);
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 430px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 28px;
      box-shadow: var(--shadow);
      padding: clamp(16px, 4vw, 24px) clamp(16px, 4vw, 22px) clamp(16px, 4vw, 22px);
      text-align: center;
    }

    .logo-wrapper {
      width: 100%;
      max-width: clamp(180px, 52vw, 250px);
      aspect-ratio: 16 / 6;
      margin: 0 auto clamp(8px, 2.5vw, 14px);
      background: transparent;
      overflow: hidden;
    }

    .logo-wrapper img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      object-position: center;
    }

    p {
      margin: 0 0 clamp(12px, 2.6vw, 18px);
      color: var(--muted);
      font-size: 0.98rem;
      line-height: 1.45;
    }

    .links {
      display: grid;
      gap: clamp(10px, 2vw, 12px);
      margin-top: 0;
    }

    .link-btn {
      text-decoration: none;
      color: #fff;
      font-weight: 600;
      padding: 14px 16px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--brand), var(--brand-2));
      border: 1px solid rgba(255, 255, 255, 0.25);
      transition: transform 0.18s ease, box-shadow 0.18s ease, filter 0.18s ease;
      box-shadow: 0 8px 16px rgba(148, 105, 67, 0.25);
    }

    .link-btn:hover,
    .link-btn:focus-visible {
      transform: translateY(-2px);
      filter: brightness(1.05);
      box-shadow: 0 11px 22px rgba(148, 105, 67, 0.3);
      outline: none;
    }

    footer {
      margin-top: 18px;
      font-size: 0.78rem;
      color: #9b8675;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo-wrapper">
      <img src="assets/logo-certart.png" alt="Cer.Art — peças de cerâmica e artesanato" width="1024" height="853" decoding="async" />
    </div>

    <p>Peças de cerâmica e artesanato feitas com muito carinho, trazendo a magia do universo infantil e o encanto dos bichinhos de pano. Escolha um canal abaixo para comprar ou falar com a gente.</p>

    <section id="cta-links" class="links" aria-label="Links principais">
      <a
        class="link-btn js-outbound-cta"
        href="https://br.shp.ee/tzdwR5fn"
        target="_blank"
        rel="noopener noreferrer"
        data-link-name="shopee"
        data-gtm-element="cta-shopee"
        data-gtm-location="landing-main-card"
        data-gtm-action="click_outbound_shopee"
      >Shopee</a>
      <a
        class="link-btn js-outbound-cta"
        href="https://wa.me/5511978533495"
        target="_blank"
        rel="noopener noreferrer"
        data-link-name="whatsapp"
        data-gtm-element="cta-whatsapp"
        data-gtm-location="landing-main-card"
        data-gtm-action="click_outbound_whatsapp"
      >WhatsApp</a>
      <a
        class="link-btn js-outbound-cta"
        href="https://www.instagram.com/_cer.art?igsh=MTBpYmtrdGQwZmh3cw%3D%3D&utm_source=qr"
        target="_blank"
        rel="noopener noreferrer"
        data-link-name="instagram"
        data-gtm-element="cta-instagram"
        data-gtm-location="landing-main-card"
        data-gtm-action="click_outbound_instagram"
      >Instagram</a>
    </section>

    <footer>cer.art</footer>
  </main>
  <script>
    document.querySelectorAll(".js-outbound-cta").forEach(function (el) {
      el.addEventListener("click", function () {
        if (typeof gtag !== "function") return;
        var linkName =
          el.dataset.linkName ||
          el.dataset.gtmElement ||
          el.textContent.trim().toLowerCase();
        var payload = {
          link_name: linkName,
          link_url: el.href,
          outbound: true
        };
        if (el.dataset.gtmElement) payload.gtm_element = el.dataset.gtmElement;
        if (el.dataset.gtmLocation) payload.gtm_location = el.dataset.gtmLocation;
        if (el.dataset.gtmAction) payload.gtm_action = el.dataset.gtmAction;
        gtag("event", "link_click", payload);
      });
    });
  </script>
</body>
</html>
